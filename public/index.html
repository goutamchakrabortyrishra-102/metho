        <script>
            (function () {
                if (typeof window === "undefined" || typeof document === "undefined") return;

                var jsRecoveryKey = "metho_js_recovery_v2";
                var jsRecoveryMaxAttempts = 3;

                var getAttemptCount = function (key) {
                    try {
                        return Number(window.sessionStorage.getItem(key) || "0") || 0;
                    } catch (error) {
                        return -1;
                    }
                };

                var incrementAttemptCount = function (key) {
                    var attempts = getAttemptCount(key);
                    if (attempts < 0) return -1;
                    var next = attempts + 1;
                    try {
                        window.sessionStorage.setItem(key, String(next));
                    } catch (error) {
                        return -1;
                    }
                    return next;
                };

                var triggerJsRecoveryReload = function () {
                    var nextAttempt = incrementAttemptCount(jsRecoveryKey);
                    if (nextAttempt > jsRecoveryMaxAttempts) return;
                    if (nextAttempt < 0) {
                        // Fallback when sessionStorage is blocked: allow one URL-driven retry.
                        var existing = String(new URL(window.location.href).searchParams.get("_jsfix") || "").trim();
                        if (existing) return;
                    }
                    var nextUrl = new URL(window.location.href);
                    nextUrl.searchParams.set("_jsfix", String(Date.now()));
                    window.setTimeout(function () {
                        window.location.replace(nextUrl.toString());
                    }, 300);
                };

                var looksLikeScriptLoadFailure = function (rawMessage) {
                    var msg = String(rawMessage || "").toLowerCase();
                    return (
                        msg.indexOf("mime type") !== -1 ||
                        msg.indexOf("loading chunk") !== -1 ||
                        msg.indexOf("chunkloaderror") !== -1 ||
                        msg.indexOf("failed to fetch dynamically imported module") !== -1 ||
                        msg.indexOf("importing a module script failed") !== -1
                    );
                };

                window.addEventListener(
                    "error",
                    function (event) {
                        var src = String((event && event.target && event.target.src) || "");
                        if (looksLikeScriptLoadFailure(event && event.message) || src.indexOf("/static/js/") !== -1) {
                            triggerJsRecoveryReload();
                        }
                    },
                    true
                );

                window.addEventListener("unhandledrejection", function (event) {
                    var reason = event && event.reason;
                    var message = typeof reason === "string" ? reason : ((reason && reason.message) || "");
                    if (looksLikeScriptLoadFailure(message)) {
                        triggerJsRecoveryReload();
                    }
                });

                var recoveryKey = "metho_css_recovery_v2";
                var maxRules = 20;

                var hasPrimaryCssRules = function () {
                    var sheets = Array.from(document.styleSheets || []);
                    return sheets.some(function (sheet) {
                        try {
                            return (
                                typeof sheet.href === "string" &&
                                sheet.href.indexOf("/static/css/") !== -1 &&
                                sheet.cssRules &&
                                sheet.cssRules.length > maxRules
                            );
                        } catch (error) {
                            return false;
                        }
                    });
                };

                var clearClientCachesBestEffort = function () {
                    try {
                        if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
                            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                                registrations.forEach(function (registration) {
                                    registration.unregister().catch(function () { });
                                });
                            }).catch(function () { });
                        }
                    } catch (error) { }

                    try {
                        if (window.caches && window.caches.keys) {
                            window.caches.keys().then(function (keys) {
                                keys.forEach(function (key) {
                                    window.caches.delete(key).catch(function () { });
                                });
                            }).catch(function () { });
                        }
                    } catch (error) { }
                };

                var forceOneTimeReload = function () {
                    var attempts = 0;
                    try {
                        attempts = Number(window.sessionStorage.getItem(recoveryKey) || "0") || 0;
                        if (attempts >= 2) return;
                        window.sessionStorage.setItem(recoveryKey, String(attempts + 1));
                    } catch (error) {
                        return;
                    }

                    clearClientCachesBestEffort();

                    var nextUrl = new URL(window.location.href);
                    nextUrl.searchParams.set("_cssfix", String(Date.now()));
                    window.setTimeout(function () {
                        window.location.replace(nextUrl.toString());
                    }, 220);
                };

                var injectFreshStylesheetLinks = function (trackedLinks) {
                    trackedLinks.forEach(function (link) {
                        try {
                            var freshUrl = new URL(String(link.href || ""), window.location.origin);
                            freshUrl.searchParams.set("_cssfix", String(Date.now()));
                            var freshLink = document.createElement("link");
                            freshLink.rel = "stylesheet";
                            freshLink.href = freshUrl.toString();
                            document.head.appendChild(freshLink);
                        } catch (error) {
                            // Keep recovery resilient even if one URL parse fails.
                        }
                    });
                };

                var verifyStylesheetHealth = function () {
                    var trackedLinks = Array.from(document.querySelectorAll('link[rel="stylesheet"]')).filter(function (link) {
                        return String(link.href || "").indexOf("/static/css/") !== -1;
                    });

                    if (!trackedLinks.length) return;

                    trackedLinks.forEach(function (link) {
                        link.addEventListener(
                            "error",
                            function () {
                                forceOneTimeReload();
                            },
                            { once: true }
                        );
                    });

                    window.setTimeout(function () {
                        if (hasPrimaryCssRules()) return;
                        injectFreshStylesheetLinks(trackedLinks);
                        window.setTimeout(function () {
                            if (!hasPrimaryCssRules()) forceOneTimeReload();
                        }, 1300);
                    }, 2200);
                };

                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", verifyStylesheetHealth, { once: true });
                } else {
                    verifyStylesheetHealth();
                }
            })();
        </script>

                                    window.caches.delete(key).catch(function () { });
                                });

                        }
                    } catch (error) { }
                };

                var tryOneReload = function () {
                    var attempts = -1;
                    try {
                        attempts = Number(window.sessionStorage.getItem(bootRecoveryKey) || "0") || 0;
                        if (attempts >= bootRecoveryMaxAttempts) return;
                        window.sessionStorage.setItem(bootRecoveryKey, String(attempts + 1));
                    } catch (error) {
                        // When sessionStorage is unavailable, allow one query-driven retry only.
                        attempts = -1;
                    }

                    if (attempts < 0) {
                        var existing = String(new URL(window.location.href).searchParams.get("_bootfix") || "").trim();
                        if (existing) return;
                    }

                    clearClientCachesBestEffort();

                    var nextUrl = new URL(window.location.href);
                    nextUrl.searchParams.set("_bootfix", String(Date.now()));
                    window.setTimeout(function () {
                        window.location.replace(nextUrl.toString());
                    }, 1500);
                };

                window.setTimeout(function () {
                    if (window.__methoAppMounted) return;
                    tryOneReload();
                }, 9000);
            })();

            (function () {
                if (typeof window === "undefined" || typeof document === "undefined") return;

                var fallbackBootKey = "metho_template_bootstrap_v1";
                var manifestCandidates = [

                    "/build/asset-manifest.json",
                    "/frontend/build/asset-manifest.json"
                ];

                var hasMainScriptTag = function () {
                    return !!document.querySelector('script[src*="/static/js/main."]');
                };

                var markAttempted = function () {
                    try {
                        window.sessionStorage.setItem(fallbackBootKey, "1");
                    } catch (error) { }
                };

                var alreadyAttempted = function () {
                    try {
                        return window.sessionStorage.getItem(fallbackBootKey) === "1";
                    } catch (error) {
                        return false;
                    }
                };

                var fetchJson = function (url) {
                    return fetch(url, { cache: "no-store" }).then(function (response) {
                        if (!response.ok) throw new Error("manifest fetch failed");
                        return response.json();
                    });
                };

                var findManifest = function () {
                    var index = 0;
                    var walk = function () {
                        if (index >= manifestCandidates.length) return Promise.reject(new Error("manifest not found"));
                        var nextUrl = manifestCandidates[index];
                        index += 1;
                        return fetchJson(nextUrl).then(function (doc) {
                            return { url: nextUrl, doc: doc };
                        }).catch(function () {
                            return walk();
                        });
                    };
                    return walk();
                };

                var manifestBasePrefix = function (manifestUrl) {
                    if (manifestUrl.indexOf("/build/") === 0) return "/build";
                    if (manifestUrl.indexOf("/frontend/build/") === 0) return "/frontend/build";
                    return "";
                };

                var normalizeAssetUrl = function (path, basePrefix) {
                    var raw = String(path || "").trim();
                    if (!raw) return "";
                    if (raw.indexOf("http://") === 0 || raw.indexOf("https://") === 0) return raw;
                    if (raw.charAt(0) !== "/") raw = "/" + raw;
                    if (basePrefix && raw.indexOf(basePrefix + "/") !== 0) {
                        raw = basePrefix + raw;
                    }
                    return raw;
                };

                var injectCss = function (href) {
                    if (!href || document.querySelector('link[data-metho-fallback-css="' + href + '"]')) return;
                    var link = document.createElement("link");
                    link.rel = "stylesheet";
                    link.href = href;
                    link.setAttribute("data-metho-fallback-css", href);
                    document.head.appendChild(link);
                };

                var injectMainScript = function (src) {
                    if (!src || document.querySelector('script[data-metho-fallback-main="1"]')) return;
                    var script = document.createElement("script");
                    script.defer = true;
                    script.src = src;
                    script.setAttribute("data-metho-fallback-main", "1");
                    document.head.appendChild(script);
                };

                var tryManifestBootstrap = function () {
                    if (window.__methoAppMounted || hasMainScriptTag() || alreadyAttempted()) return;
                    markAttempted();
                    findManifest().then(function (payload) {
                        var doc = payload && payload.doc && typeof payload.doc === "object" ? payload.doc : {};
                        var basePrefix = manifestBasePrefix(String(payload && payload.url || ""));
                        var cssPath = "";
                        var jsPath = "";

                        if (Array.isArray(doc.entrypoints)) {
                            doc.entrypoints.forEach(function (entry) {
                                var normalized = String(entry || "");
                                if (!cssPath && /\.css($|\?)/i.test(normalized)) cssPath = normalized;
                                if (!jsPath && /main\..+\.js($|\?)/i.test(normalized)) jsPath = normalized;
                            });
                        }

                        if (!cssPath && doc.files && typeof doc.files === "object") {
                            cssPath = String(doc.files["main.css"] || "");
                        }
                        if (!jsPath && doc.files && typeof doc.files === "object") {
                            jsPath = String(doc.files["main.js"] || "");
                        }

                        var cssUrl = normalizeAssetUrl(cssPath, basePrefix);
                        var jsUrl = normalizeAssetUrl(jsPath, basePrefix);
                        if (cssUrl) injectCss(cssUrl);
                        if (jsUrl) injectMainScript(jsUrl);
                    }).catch(function () {
                        // Keep silent: existing recovery scripts will keep handling reload attempts.
                    });
                };

                window.setTimeout(tryManifestBootstrap, 800);
            })();
        </script>

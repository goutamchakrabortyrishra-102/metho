        <script>
            (function () {
                if (typeof window === "undefined" || typeof document === "undefined") return;

                var recoveryKey = "metho_css_recovery_v2";
                var maxRules = 20;

                var hasPrimaryCssRules = function () {
                    var sheets = Array.from(document.styleSheets || []);
                    return sheets.some(function (sheet) {
                        try {
                            return (
                                typeof sheet.href === "string" &&
                                sheet.href.indexOf("/static/css/") !== -1 &&
                                sheet.cssRules &&
                                sheet.cssRules.length > maxRules
                            );
                        } catch (error) {
                            return false;
                        }
                    });
                };

                var clearClientCachesBestEffort = function () {
                    try {
                        if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
                            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                                registrations.forEach(function (registration) {
                                    registration.unregister().catch(function () { });
                                });
                            }).catch(function () { });
                        }
                    } catch (error) { }

                    try {
                        if (window.caches && window.caches.keys) {
                            window.caches.keys().then(function (keys) {
                                keys.forEach(function (key) {
                                    window.caches.delete(key).catch(function () { });
                                });
                            }).catch(function () { });
                        }
                    } catch (error) { }
                };

                var forceOneTimeReload = function () {
                    var attempts = 0;
                    try {
                        attempts = Number(window.sessionStorage.getItem(recoveryKey) || "0") || 0;
                        if (attempts >= 2) return;
                        window.sessionStorage.setItem(recoveryKey, String(attempts + 1));
                    } catch (error) {
                        return;
                    }

                    clearClientCachesBestEffort();

                    var nextUrl = new URL(window.location.href);
                    nextUrl.searchParams.set("_cssfix", String(Date.now()));
                    window.setTimeout(function () {
                        window.location.replace(nextUrl.toString());
                    }, 220);
                };

                var injectFreshStylesheetLinks = function (trackedLinks) {
                    trackedLinks.forEach(function (link) {
                        try {
                            var freshUrl = new URL(String(link.href || ""), window.location.origin);
                            freshUrl.searchParams.set("_cssfix", String(Date.now()));
                            var freshLink = document.createElement("link");
                            freshLink.rel = "stylesheet";
                            freshLink.href = freshUrl.toString();
                            document.head.appendChild(freshLink);
                        } catch (error) {
                            // Keep recovery resilient even if one URL parse fails.
                        }
                    });
                };

                var verifyStylesheetHealth = function () {
                    var trackedLinks = Array.from(document.querySelectorAll('link[rel="stylesheet"]')).filter(function (link) {
                        return String(link.href || "").indexOf("/static/css/") !== -1;
                    });

                    if (!trackedLinks.length) return;

                    trackedLinks.forEach(function (link) {
                        link.addEventListener(
                            "error",
                            function () {
                                forceOneTimeReload();
                            },
                            { once: true }
                        );
                    });

                    window.setTimeout(function () {
                        if (hasPrimaryCssRules()) return;
                        injectFreshStylesheetLinks(trackedLinks);
                        window.setTimeout(function () {
                            if (!hasPrimaryCssRules()) forceOneTimeReload();
                        }, 1300);
                    }, 2200);
                };

                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", verifyStylesheetHealth, { once: true });
                } else {
                    verifyStylesheetHealth();
                }
            })();
        </script>

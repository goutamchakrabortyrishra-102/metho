                window.setTimeout(function () {

                    } catch (e) {}
                }, 3500);
                window.addEventListener("load", function () {
                    try {
                        if (hasMountedApp()) sessionStorage.removeItem(RETRY_KEY);
                    } catch (e) {}
                });

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.metho.aayupay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.metho.aayupay'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
